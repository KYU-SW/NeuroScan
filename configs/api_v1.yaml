# Phase 5B FastAPI backend (development MVP, no authentication): localhost only.
# Relative paths are resolved against the repository root.
version: api_v1
host: 127.0.0.1          # must be a loopback address (enforced by python -m neuroscan_api)
port: 8000
debug: false             # true = development mode: Swagger/OpenAPI at /api/v1/docs
allowed_hosts: [127.0.0.1, localhost]
cors_origins: []         # e.g. ["http://localhost:5173"] for a local React dev server
storage_root: storage    # uploads/, runs/, temp/, neuroscan.db (git-ignored)
inference_config: configs/inference_v1.yaml

limits:
  max_file_bytes: 67108864          # 64 MiB per uploaded file (compressed)
  max_request_bytes: 146800640      # 140 MiB per upload request
  max_uncompressed_bytes: 536870912 # 512 MiB after gzip decompression
  max_voxels: 67108864              # 64M voxels
  max_axis: 1024
  min_free_bytes: 2147483648        # refuse uploads below 2 GiB free disk space
  max_queued_runs: 20

worker:
  device: auto                      # auto | cuda | cpu (passed to the Phase 5A service)
  poll_interval_s: 0.5
  heartbeat_interval_s: 5
  lease_stale_after_s: 30           # a worker lease older than this may be taken over
  run_stale_after_s: 60             # running run without heartbeat -> failed E_WORKER_LOST
  run_timeout_s: 300                # running longer than this -> failed E_TIMEOUT
