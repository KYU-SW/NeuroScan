# NeuroScan v2 2D baseline (design fixed; formal training NOT yet approved).
# Code, synthetic tests and protocol only. Training hyperparameters are pending approval and are
# intentionally left null; nothing here was tuned on real data.

run_name: v2_2d_baseline
stage: train
dataset_id: isles2022
status: design_fixed_training_pending_approval

model:
  id: neuroscan_v2_2d_baseline_v1
  levels: 4
  channels: [36, 72, 144, 288]
  block: conv3x3-instancenorm_affine-relu_x2
  downsample: maxpool2
  upsample: convtranspose2x2_stride2
  in_channels: 2            # dwi_z, adc_z
  out_channels: 1           # logit -> sigmoid probability
  trainable_parameters: 2439577
  input_multiple: 8
  pretrained_weights: null

data:
  split_source: data/splits/split_v1_seed42.json   # read-only; train 176 / val 37 (ISLES only)
  train_split: train
  validation_split: val
  forbidden_splits: [test, final_test]
  soop: excluded

preprocessing:
  policy: preprocess_v2_isles_1mm_inplane_v1
  slice_axis: 2
  slice_axis_resampled: false
  target_grid:            # checked against code by baseline_preprocess.validate_policy_config
    inplane_spacing_mm: [1.0, 1.0]
    preserve_z_spacing: true
    size_policy: [integer_snap_if_close, otherwise_ceil]   # raw = size * spacing / 1.0
    integer_snap_rtol: 1.0e-6
    integer_snap_atol: 1.0e-6
  gt_decode:
    policy_id: binary_mask_decode_v1_atol_1e_6
    decoded_values: true            # NIfTI scaling applied
    use_get_unscaled: false
    use_threshold_binarization: false
    zero_atol: 1.0e-6
    one_atol: 1.0e-6
    reject_other_values: true
    reject_nan_inf: true
  grid_alignment: voxel0_outer_corner_fixed_direction_cosines_kept
  interpolation: {dwi: linear, adc: linear, gt: nearest, brain_mask: nearest}
  brain_mask_grid: original
  normalisation: per_case_zscore_over_brain_mask
  adc_values_converted: false
  padding:
    rule: zero_end_to_multiple_of_8
    values: {dwi_z: 0.0, adc_z: 0.0, gt: 0, brain_mask: 0}
    valid_region_mask: real_1_padding_0
    loss_region: valid_region_mask_only   # BCE and Dice, per-sample mean
    inference: crop_padding_then_restore_to_original_grid

outputs:
  grid: original
  probability_restore: linear
  brain_mask_roles:
    original_grid: [final_gating, boundary_analysis, original_space_qa]
    model_grid: [input_normalisation, model_input_qa]
    nearest_roundtrip: [xor_vs_original, roundtrip_interpolation_qa]
  threshold_applied_on: original_grid
  official_output: ungated
  gated: comparison_only           # gated = ungated AND brain_mask
  outside_mask_predictions: recorded_never_removed
  boundary_record: [outside_brain_mask_voxels, outside_brain_mask_ratio, touches_image_edge, min_distance_to_brain_boundary_mm, boundary_warnings]

selection:
  split: val
  threshold: 0.5
  output: ungated
  primary: mean_dice_positive_cases
  dice_tie_tolerance: 0.0001
  tie_breaks: [lower_validation_loss, lower_false_positive_voxel_volume_ml, earlier_epoch]

threshold_search:
  after_checkpoint_fixed: true
  searches: 1
  split: val
  candidates: {start: 0.10, stop: 0.90, step: 0.05}
  primary: mean_dice_positive_cases_ungated
  tie_break: closest_to_0.5
  recorded: [lesion_recall, missed_small_lesions, false_positive_voxel_volume_ml, no_lesion_fp_volume_ml]
  optimistic_bias_reported: true
  fp_threshold_optimised: false

safety_metrics:
  grid: original
  connectivity: 26
  match_rule: overlap_ge_1_voxel_exploratory_not_clinical_tp
  small_lesion_bins_ml: [0.1, 0.5, 1.0]
  false_positive_voxel_volume_ml: pred_and_not_gt          # voxel-level; selection tie-break
  no_gt_overlap_component_volume_ml: components_without_gt_overlap
  no_gt_overlap_component_count: components_without_gt_overlap
  oversegmentation_volume_ml: outside_gt_in_gt_overlapping_components
  thick_slice_policies:    # two separate rules; never merged or used interchangeably
    isles_subgroup:
      policy_id: isles_v1_qa_thick_subgroup_3mm
      effective_z_spacing_mm_gt: 3.0
      purpose: analysis_subgroup
    soop_provisional_warning:
      policy_id: soop_provisional_thick_warning_5mm
      effective_z_spacing_mm_gt: 5.0
      slice_thickness_mm_gte: 5.0
      provisional: true

training:                 # approved; checked against code by baseline_training.validate_hyperparameters
  max_epochs: 100
  early_stopping_patience: 20
  batch_size: 32
  num_workers: 0
  seed: 42
  precision: fp32
  amp: false
  tf32_matmul: false
  tf32_convolution: false
  deterministic_algorithms: true
  cudnn_benchmark: false
  device: cuda                    # device_policy_v2_baseline_cuda_required_v1 (formal ISLES runs)
  augmentation: none              # no augmentation approved
  optimizer: {name: adamw, learning_rate: 1.0e-3, weight_decay: 1.0e-4}
  scheduler: {name: cosine_annealing, minimum_learning_rate: 1.0e-6, step: epoch, t_max_epochs: 100}
  loss:
    dice_weight: 1.0
    bce_weight: 1.0
    dice_smooth: 1.0
    region: valid_region_mask
    reduction: per_sample_mean_then_batch_mean
  gradient_clipping: {norm_type: 2, max_norm: 1.0}
  sampling:
    candidates: brain_mask_slices
    positive_fraction: 0.5
    order: deterministic_run_seed_and_epoch
    keep_negative_slices: true
  threshold: {value: 0.5, source: baseline_checkpoint_fixed_0_5, optimized: false}
  automatic_adjustment: forbidden   # no batch / lr / amp / tf32 / worker / threshold / loss changes, no OOM retry

collapse_policy:          # checked against code by baseline_training.validate_hyperparameters
  stop_immediately:
    - non_finite_loss
    - non_finite_parameter
    - non_finite_gradient
    - probability_out_of_range
    - all_one_validation_prediction
    - missing_required_validation_output
    - cuda_oom
    - deterministic_algorithm_error
  record_only:
    - empty_validation_prediction
    - all_validation_cases_empty_in_single_epoch
    - low_validation_dice
  consecutive_empty_policy:
    action: rely_on_early_stopping
    early_stopping_patience: 20
    separate_empty_epoch_limit: null

determinism:
  precision: fp32
  automatic_mixed_precision: false
  tf32_matmul: false
  tf32_convolution: false
  torch_deterministic_algorithms: true
  cudnn_deterministic: true
  cudnn_benchmark: false

run_control:
  training_output_profile: baseline_v1

policies:
  preprocessing: preprocess_v2_isles_1mm_inplane_v1
  inference: v2_2d_slicewise_sigmoid_original_grid_v1
  threshold: fixed_0.5_selection_then_single_val_search
  brain_mask: skull_stripped_background_isles_v2
  combination: single_model_2d
